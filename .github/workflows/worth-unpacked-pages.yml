name: Publish Worth Unpacked Power Checker

on:
  push:
    branches:
      - worth-unpacked-checker
    paths:
      - 'tools/power-checker/**'
      - '.github/workflows/worth-unpacked-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: worth-unpacked-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload checker
        uses: actions/upload-pages-artifact@v4
        with:
          path: tools/power-checker

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
