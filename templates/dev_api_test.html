{% extends "base.html" %}
{% block title %}API Diagnostics{% endblock %}
{% block content %}
<div class="container-fluid">
  <h2 class="fw-bold mb-4"><i class="bi bi-bug me-2"></i>API Diagnostics</h2>
  <div class="d-grid gap-3">
    {% for r in results %}
    <div class="card border-0 shadow-sm">
      <div class="card-header d-flex align-items-center gap-2 py-2
                  {% if r.ok %}bg-success-subtle{% else %}bg-danger-subtle{% endif %}">
        <span class="fw-bold">{{ r.name }}</span>
        {% if r.ok %}
          <span class="badge bg-success ms-auto">OK</span>
          <span class="text-muted small">keys: {{ r['keys'] | join(', ') }}</span>
        {% else %}
          <span class="badge bg-danger ms-auto">FAIL</span>
        {% endif %}
      </div>
      <div class="card-body p-0">
        <pre class="m-0 p-3" style="font-size:.75rem;max-height:200px;overflow-y:auto;background:#0d1117;color:{% if r.ok %}#3fb950{% else %}#ff7b72{% endif %}">{{ r.raw }}</pre>
      </div>
    </div>
    {% endfor %}
  </div>
</div>
{% endblock %}
