{% extends "base.html" %}
{% block title %}New Listing — TradeMe Store Manager{% endblock %}
{% block content %}
<div class="container" style="max-width:720px">
  <a href="{{ url_for('listings') }}" class="btn btn-outline-secondary btn-sm mb-4">
    <i class="bi bi-arrow-left me-1"></i>Back to Listings
  </a>
  <h2 class="fw-bold mb-4"><i class="bi bi-plus-circle me-2"></i>Create New Listing</h2>

  <div class="card border-0 shadow-sm">
    <div class="card-body p-4">
      <form method="post" action="{{ url_for('listing_new') }}">
        <div class="mb-3">
          <label class="form-label fw-semibold">Title <span class="text-danger">*</span></label>
          <input type="text" class="form-control" name="title" required maxlength="50"
                 placeholder="e.g. Nike Air Max 90 Size 10 — Brand New">
          <div class="form-text">Max 50 characters</div>
        </div>

        <div class="mb-3">
          <label class="form-label fw-semibold">Category Number <span class="text-danger">*</span></label>
          <input type="text" class="form-control" name="category" required
                 placeholder="e.g. 0001 (TradeMe category number)">
          <div class="form-text">Find category numbers in the TradeMe category tree.</div>
        </div>

        <div class="mb-3">
          <label class="form-label fw-semibold">Description <span class="text-danger">*</span></label>
          <textarea class="form-control" name="description" rows="6" required
                    placeholder="Describe your item..."></textarea>
        </div>

        <div class="row g-3 mb-3">
          <div class="col-md-4">
            <label class="form-label fw-semibold">Buy Now Price (NZD)</label>
            <div class="input-group">
              <span class="input-group-text">$</span>
              <input type="number" class="form-control" name="buy_now_price"
                     min="0" step="0.01" placeholder="0.00">
            </div>
          </div>
          <div class="col-md-4">
            <label class="form-label fw-semibold">Start Price (NZD)</label>
            <div class="input-group">
              <span class="input-group-text">$</span>
              <input type="number" class="form-control" name="start_price"
                     min="0" step="0.01" placeholder="0.00">
            </div>
          </div>
          <div class="col-md-4">
            <label class="form-label fw-semibold">Reserve Price (NZD)</label>
            <div class="input-group">
              <span class="input-group-text">$</span>
              <input type="number" class="form-control" name="reserve_price"
                     min="0" step="0.01" placeholder="0.00">
            </div>
          </div>
        </div>

        <div class="row g-3 mb-3">
          <div class="col-md-6">
            <label class="form-label fw-semibold">Quantity</label>
            <input type="number" class="form-control" name="quantity" min="1" value="1">
          </div>
          <div class="col-md-6">
            <label class="form-label fw-semibold">Duration (days)</label>
            <select class="form-select" name="duration">
              <option value="2">2 days</option>
              <option value="3">3 days</option>
              <option value="4">4 days</option>
              <option value="5">5 days</option>
              <option value="7" selected>7 days</option>
              <option value="10">10 days</option>
              <option value="14">14 days</option>
            </select>
          </div>
        </div>

        <div class="mb-4">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" name="is_brand_new" id="isBrandNew">
            <label class="form-check-label" for="isBrandNew">Brand New item</label>
          </div>
        </div>

        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-primary">
            <i class="bi bi-plus-circle me-1"></i>Create Listing
          </button>
          <a href="{{ url_for('listings') }}" class="btn btn-outline-secondary">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
